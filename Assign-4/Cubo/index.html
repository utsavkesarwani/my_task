<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
    rel="stylesheet"
/>
    <title>Cubo</title>
</head>
<body>
    <main>
        <div class="left-top"></div>
        <div class="left-bottom"></div>
        
        <div class="top-center1">
            <div class="top-center1-div1">
                <div>
                    <h1>4.875</h1>
                    
                    <p class="p1"> Project Views <br> last year</p>
                    <div class="para">
                        <p class="p2">
                            <i class="ri-arrow-right-up-long-fill"></i>
                            <span>+15% </span>
                        
                        </p>
                    <p class="p3">vs last year</p>
                    </div>
                </div>
                <div class="icon">
                    <i class="ri-heart-line"></i>
                </div>

            </div>
        </div>

        <div class="top-center2">
            <div class="top-center2-div1">
                
                <div>
                    <h2>New Users </h2>
                    <h1>57K</h1>
                    <h5>+10% <i class="ri-arrow-right-up-line"></i></h5>
                    <p>vs last month</p>
                </div>
                <div class="icon">
                    <i class="ri-group-line"></i>
                </div>
            </div>
        </div>
        
        <div class="center">
            <div class="circle">  
            </div>
            <img src="./girl_image_cubo-Photoroom-removebg-preview.png" alt="girl_image">
            
        </div>
        
        <div class="bottom-center1"></div>
        <div class="bottom-center2">
            <div class="bottom-center2-div1">
                <h3>We Build Future of <br>Design Industry</h3>
                <p>Crafting meaning UI/UX Design</p>
                <button>Explore More  > </button>
            </div>
            <img src="./black_cla.png" width="200px" height="200px" alt="balck_clature">
        </div>


        <div class="right-top">
            <div class="right-top-div1">
                <p>Team of Passionate <br> designers and <br> developers</p>
                <img src="https://plus.unsplash.com/premium_photo-1671656349322-41de944d259b?q=80&w=1974&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D">
                <img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?q=80&w=687&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D">
                <img src="https://images.unsplash.com/photo-1632765854612-9b02b6ec2b15?q=80&w=1972&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D">
                <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?q=80&w=764&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D">
                <img src="./+2.png" class="two" alt="plus_2">
            </div>
        <hr>        
            <div class="right-top-div2">
                
                <div>
                    <h2>Daily <br>New clients</h2>
                    <h1>54</h1>
                    <h5>+40% <i class="ri-arrow-right-up-line"></i></h5>
                    <p>vs yesterday</p>
                </div>
                <div class="icon">
                    <i class="ri-user-add-line"></i>
                </div>
            </div>
        </div>
        <div class="right-bottom">

            <div class="right-bottom-div">
                <img src="./cubo_logo.png" alt="CUBO Logo">
                <h2>CUBO</h2>
                <p>Digital Studio</p>

                <button>Discover More   > </button>
            </div>
        </div>
    </main>
</body>
</html>

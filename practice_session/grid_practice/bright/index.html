<!DOCTYPE html>

                    <i class="ri-poker-hearts-line"></i>
                </div>
            </div>
            <div class="bottom-center">
                <div class="cycle">
                    <p>Start from $105.00</p>
                    <h1>Cycle Accessories</h1>
                    <i class="ri-poker-hearts-line"></i>
                </div>
            </div>
            <div class="bottom-right">
                <div class="home">
                    <p>Start from $34.00</p>
                    <h1>Home Accessories</h1>
                    <i class="ri-poker-hearts-line"></i>
